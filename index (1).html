<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Árbol Familiar</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <h1>Árbol Familiar</h1>
      <span id="peopleCounter">Cargando...</span>
    </div>

    <div class="toolbar">
      <input id="searchPerson" type="search" placeholder="Buscar persona..." aria-label="Buscar persona" />
      <select id="generationFilter" aria-label="Filtrar por generación">
        <option value="all">Todas las generaciones</option>
      </select>
      <button id="focusRoot">Edgar Yael</button>
      <button id="showSiblingLinks">Líneas de hermanos</button>
      <button id="resetView">Centrar vista</button>
    </div>
  </header>

  <main class="layout">
    <section id="tree-container">
      <svg></svg>
      <div class="legend">
        <span><i class="dot male-dot"></i> Hombre</span>
        <span><i class="dot female-dot"></i> Mujer</span>
        <span><i class="dot neutral-dot"></i> Sin especificar</span>
      </div>
    </section>

    <aside class="side-panel" id="personPanel">
      <h2>Persona seleccionada</h2>
      <p class="empty">Haz clic en cualquier tarjeta para ver sus padres, hermanos, pareja e hijos.</p>
    </aside>
  </main>

  <script>
    const svg = d3.select("svg");
    const g = svg.append("g");
    const linkLayer = g.append("g").attr("class", "link-layer");
    const siblingLayer = g.append("g").attr("class", "sibling-layer");
    const labelLayer = g.append("g").attr("class", "label-layer");
    const nodeLayer = g.append("g").attr("class", "node-layer");

    const zoom = d3.zoom().scaleExtent([0.16, 2.5]).on("zoom", event => g.attr("transform", event.transform));
    svg.call(zoom);

    const cardWidth = 190;
    const cardHeight = 104;
    const xGap = 42;
    const yGap = 210;
    const leftPad = 210;
    const topPad = 95;

    let people = [];
    let byId = new Map();
    let selectedId = null;
    let showAllSiblingLinks = false;
    let activeGeneration = "all";
    let currentSearch = "";
    let dimensions = { width: 1200, height: 800 };

    function resize() {
      const container = document.getElementById("tree-container");
      const rect = container.getBoundingClientRect();
      svg.attr("width", rect.width).attr("height", rect.height);
    }
    window.addEventListener("resize", resize);

    const escapeHtml = value => String(value || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    function personClass(person) {
      if (person.gender === "Hombre") return "person-box male";
      if (person.gender === "Mujer") return "person-box female";
      return "person-box neutral";
    }

    function generationOrder(person) {
      return person.generation ?? -1;
    }

    function relationNames(ids) {
      return (ids || []).map(id => byId.get(id)).filter(Boolean).map(person => person.name);
    }

    function relationButtons(ids) {
      const persons = (ids || []).map(id => byId.get(id)).filter(Boolean);
      if (!persons.length) return '<p class="empty small">Sin registro</p>';
      return `<div class="relation-list">${persons.map(p => `<button data-person-id="${p.id}">${escapeHtml(p.name)}</button>`).join("")}</div>`;
    }

    function renderPanel(person) {
      const panel = document.getElementById("personPanel");
      if (!person) {
        panel.innerHTML = `<h2>Persona seleccionada</h2><p class="empty">Haz clic en cualquier tarjeta para ver sus relaciones.</p>`;
        return;
      }

      panel.innerHTML = `
        <h2>${escapeHtml(person.name)}</h2>
        <p class="badge">${escapeHtml(person.generationLabel || "Por confirmar")}</p>
        <p class="muted">${escapeHtml([person.years, person.gender].filter(Boolean).join(" · "))}</p>

        <h3>Pareja (${(person.spouses || []).length})</h3>
        ${relationButtons(person.spouses)}

        <h3>Padres (${(person.parents || []).length})</h3>
        ${relationButtons(person.parents)}

        <h3>Hermanos (${(person.siblings || []).length})</h3>
        ${relationButtons(person.siblings)}

        <h3>Hijos (${(person.children || []).length})</h3>
        ${relationButtons(person.children)}
      `;

      panel.querySelectorAll("button[data-person-id]").forEach(button => {
        button.addEventListener("click", () => selectPerson(button.dataset.personId, true));
      });
    }

    function wrapText(textSelection, maxWidth) {
      textSelection.each(function() {
        const text = d3.select(this);
        const words = (text.text() || "").split(/\s+/).reverse();
        let line = [];
        let lineNumber = 0;
        const lineHeight = 14;
        const y = Number(text.attr("y"));
        const x = Number(text.attr("x") || 0);
        text.text(null);
        let tspan = text.append("tspan").attr("x", x).attr("y", y);
        while (words.length) {
          const word = words.pop();
          line.push(word);
          tspan.text(line.join(" "));
          if (tspan.node().getComputedTextLength() > maxWidth && line.length > 1) {
            line.pop();
            tspan.text(line.join(" "));
            line = [word];
            tspan = text.append("tspan").attr("x", x).attr("y", y).attr("dy", `${++lineNumber * lineHeight}px`).text(word);
          }
        }
      });
    }

    function computeLayout() {
      const confirmedGenerations = [...new Set(people.map(p => p.generation).filter(Number.isFinite))].sort((a, b) => b - a);
      const hasPending = people.some(p => !Number.isFinite(p.generation));
      const generationKeys = hasPending ? [...confirmedGenerations, null] : confirmedGenerations;

      const byGeneration = new Map(generationKeys.map(key => [key, []]));
      people.forEach(person => {
        const key = Number.isFinite(person.generation) ? person.generation : null;
        byGeneration.get(key).push(person);
      });

      generationKeys.forEach(key => {
        const row = byGeneration.get(key);
        row.sort((a, b) => {
          const parentA = relationNames(a.parents).join(" ");
          const parentB = relationNames(b.parents).join(" ");
          return parentA.localeCompare(parentB, "es") || a.name.localeCompare(b.name, "es");
        });
        row.forEach((person, index) => {
          person.x = leftPad + index * (cardWidth + xGap);
          person.y = topPad + generationKeys.indexOf(key) * yGap;
        });
      });

      const maxRow = Math.max(...generationKeys.map(key => byGeneration.get(key).length), 1);
      dimensions = {
        width: leftPad + maxRow * (cardWidth + xGap) + 280,
        height: topPad + generationKeys.length * yGap + 140,
        generationKeys,
        byGeneration
      };
    }

    function visiblePeople() {
      return people.filter(person => activeGeneration === "all" || String(person.generation ?? "pending") === activeGeneration);
    }

    function visibleIds() {
      return new Set(visiblePeople().map(person => person.id));
    }

    function getRelationSet(person) {
      if (!person) return new Set();
      return new Set([person.id, ...(person.spouses || []), ...(person.parents || []), ...(person.siblings || []), ...(person.children || [])]);
    }

    function drawGenerationLabels() {
      const labels = dimensions.generationKeys.map(key => {
        const row = dimensions.byGeneration.get(key);
        const label = key === null ? "Por confirmar" : `Generación ${key}`;
        return { key, label, count: row.length, y: topPad + dimensions.generationKeys.indexOf(key) * yGap };
      });

      const label = labelLayer.selectAll("g.generation-label").data(labels, d => d.label);
      label.exit().remove();
      const enter = label.enter().append("g").attr("class", "generation-label");
      enter.append("rect").attr("x", 20).attr("y", -24).attr("width", 150).attr("height", 48).attr("rx", 16);
      enter.append("text").attr("class", "generation-title").attr("x", 95).attr("y", -3).attr("text-anchor", "middle");
      enter.append("text").attr("class", "generation-count").attr("x", 95).attr("y", 15).attr("text-anchor", "middle");
      enter.merge(label).attr("transform", d => `translate(0,${d.y})`);
      enter.merge(label).select(".generation-title").text(d => d.label);
      enter.merge(label).select(".generation-count").text(d => `${d.count} persona${d.count === 1 ? "" : "s"}`);
    }

    function parentChildLinks() {
      const ids = visibleIds();
      const links = [];
      visiblePeople().forEach(child => {
        (child.parents || []).forEach(parentId => {
          const parent = byId.get(parentId);
          if (parent && ids.has(parent.id)) links.push({ source: parent, target: child, type: "parent" });
        });
      });
      return links;
    }

    function siblingLinks() {
      const ids = visibleIds();
      const selected = byId.get(selectedId);
      const selectedRelationSet = getRelationSet(selected);
      const seen = new Set();
      const links = [];
      visiblePeople().forEach(person => {
        (person.siblings || []).forEach(siblingId => {
          if (!ids.has(siblingId)) return;
          const sibling = byId.get(siblingId);
          if (!sibling) return;
          const key = [person.id, sibling.id].sort().join("|");
          if (seen.has(key)) return;
          const isSelectedRelation = selectedRelationSet.has(person.id) && selectedRelationSet.has(sibling.id);
          if (showAllSiblingLinks || isSelectedRelation) {
            seen.add(key);
            links.push({ source: person, target: sibling, type: "sibling" });
          }
        });
      });
      return links;
    }

    function linkPath(d) {
      const sx = d.source.x;
      const sy = d.source.y + cardHeight / 2;
      const tx = d.target.x;
      const ty = d.target.y - cardHeight / 2;
      const midY = (sy + ty) / 2;
      return `M ${sx},${sy} C ${sx},${midY} ${tx},${midY} ${tx},${ty}`;
    }

    function siblingPath(d) {
      const sy = d.source.y;
      const ty = d.target.y;
      const sx = d.source.x + (d.source.x < d.target.x ? cardWidth / 2 : -cardWidth / 2);
      const tx = d.target.x + (d.source.x < d.target.x ? -cardWidth / 2 : cardWidth / 2);
      const curve = Math.max(40, Math.abs(tx - sx) / 4);
      return `M ${sx},${sy} C ${sx},${sy - curve} ${tx},${ty - curve} ${tx},${ty}`;
    }

    function drawLinks() {
      const selected = byId.get(selectedId);
      const relationSet = getRelationSet(selected);
      const links = linkLayer.selectAll("path.link").data(parentChildLinks(), d => `${d.source.id}-${d.target.id}`);
      links.exit().remove();
      links.enter().append("path").attr("class", "link").merge(links)
        .classed("related", d => selected && relationSet.has(d.source.id) && relationSet.has(d.target.id))
        .attr("d", linkPath);

      const sLinks = siblingLayer.selectAll("path.sibling-link").data(siblingLinks(), d => `${d.source.id}-${d.target.id}`);
      sLinks.exit().remove();
      sLinks.enter().append("path").attr("class", "sibling-link").merge(sLinks).attr("d", siblingPath);
    }

    function drawNodes() {
      const ids = visibleIds();
      const data = people.filter(p => ids.has(p.id));
      const selected = byId.get(selectedId);
      const relationSet = getRelationSet(selected);
      const search = currentSearch.toLowerCase();

      const node = nodeLayer.selectAll("g.person-card").data(data, d => d.id);
      node.exit().remove();

      const enter = node.enter().append("g")
        .attr("class", "person-card")
        .on("click", (event, d) => selectPerson(d.id, false));

      enter.append("rect")
        .attr("x", -cardWidth / 2)
        .attr("y", -cardHeight / 2)
        .attr("width", cardWidth)
        .attr("height", cardHeight)
        .attr("rx", 18)
        .attr("ry", 18);

      enter.append("text")
        .attr("class", "person-name")
        .attr("text-anchor", "middle")
        .attr("x", 0)
        .attr("y", -22)
        .text(d => d.name)
        .call(wrapText, cardWidth - 34);

      enter.append("text")
        .attr("class", "person-info")
        .attr("text-anchor", "middle")
        .attr("x", 0)
        .attr("y", 24);

      enter.append("text")
        .attr("class", "mini-meta")
        .attr("text-anchor", "middle")
        .attr("x", 0)
        .attr("y", 42);

      const merged = enter.merge(node)
        .attr("transform", d => `translate(${d.x},${d.y})`)
        .classed("selected", d => d.id === selectedId)
        .classed("dimmed", d => selectedId && !relationSet.has(d.id))
        .classed("related", d => selectedId && relationSet.has(d.id) && d.id !== selectedId)
        .classed("highlight", d => search && d.name.toLowerCase().includes(search));

      merged.select("rect").attr("class", d => personClass(d));
      merged.select(".person-info").text(d => d.years || d.generationLabel || "");
      merged.select(".mini-meta").text(d => {
        const p = (d.parents || []).length;
        const h = (d.children || []).length;
        return `${p} padre${p === 1 ? "" : "s"} · ${h} hijo${h === 1 ? "" : "s"}`;
      });
    }

    function update() {
      drawGenerationLabels();
      drawLinks();
      drawNodes();
    }

    function selectPerson(id, center = false) {
      selectedId = id;
      const person = byId.get(id);
      renderPanel(person);
      update();
      if (center && person) centerOn(person);
    }

    function centerOn(person) {
      const svgNode = svg.node();
      const width = svgNode.clientWidth || 1000;
      const height = svgNode.clientHeight || 700;
      const scale = 0.86;
      svg.transition().duration(450).call(
        zoom.transform,
        d3.zoomIdentity.translate(width / 2 - person.x * scale, height / 2 - person.y * scale).scale(scale)
      );
    }

    function centerView() {
      const svgNode = svg.node();
      const scale = Math.min(0.82, Math.max(0.22, (svgNode.clientWidth || 1000) / dimensions.width));
      svg.transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(24, 28).scale(scale));
    }

    function populateGenerationFilter() {
      const select = document.getElementById("generationFilter");
      const generations = [...new Set(people.map(p => p.generation).filter(Number.isFinite))].sort((a, b) => b - a);
      generations.forEach(gen => {
        const option = document.createElement("option");
        option.value = String(gen);
        option.textContent = `Generación ${gen}`;
        select.appendChild(option);
      });
      if (people.some(p => !Number.isFinite(p.generation))) {
        const option = document.createElement("option");
        option.value = "pending";
        option.textContent = "Por confirmar";
        select.appendChild(option);
      }
    }

    fetch("family.json")
      .then(response => response.json())
      .then(data => {
        people = data.people || [];
        byId = new Map(people.map(person => [person.id, person]));
        document.getElementById("peopleCounter").textContent = `${people.length} personas organizadas por generación`;
        resize();
        computeLayout();
        populateGenerationFilter();
        update();
        centerView();

        const rootId = data.rootId || people.find(p => p.name === "Edgar Yael Miranda Islas")?.id;
        if (rootId) selectPerson(rootId, true);

        document.getElementById("resetView").addEventListener("click", centerView);
        document.getElementById("focusRoot").addEventListener("click", () => {
          const root = byId.get(rootId);
          if (root) selectPerson(root.id, true);
        });
        document.getElementById("showSiblingLinks").addEventListener("click", event => {
          showAllSiblingLinks = !showAllSiblingLinks;
          event.currentTarget.classList.toggle("active", showAllSiblingLinks);
          update();
        });
        document.getElementById("generationFilter").addEventListener("change", event => {
          activeGeneration = event.target.value;
          selectedId = null;
          renderPanel(null);
          update();
          centerView();
        });
        document.getElementById("searchPerson").addEventListener("input", event => {
          currentSearch = event.target.value.trim();
          update();
          if (currentSearch.length >= 3) {
            const match = visiblePeople().find(person => person.name.toLowerCase().includes(currentSearch.toLowerCase()));
            if (match) selectPerson(match.id, true);
          }
        });
      })
      .catch(error => {
        document.getElementById("peopleCounter").textContent = "No se pudo cargar family.json";
        console.error(error);
      });
  </script>
</body>
</html>
