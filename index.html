<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Árbol Familiar</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <h1>Árbol Familiar</h1>
      <span id="peopleCounter">Cargando...</span>
    </div>

    <div class="toolbar">
      <input id="searchPerson" type="search" placeholder="Buscar persona..." aria-label="Buscar persona" />
      <button id="toggleAllRelations">Expandir todo</button>
      <button id="resetView">Centrar vista</button>
    </div>
  </header>

  <main class="layout">
    <section id="tree-container">
      <svg></svg>
      <div class="legend">
        <span><i class="dot male-dot"></i> Hombre</span>
        <span><i class="dot female-dot"></i> Mujer</span>
        <span><i class="dot neutral-dot"></i> Sin especificar</span>
      </div>
    </section>

    <aside class="side-panel" id="personPanel">
      <h2>Persona seleccionada</h2>
      <p class="empty">Haz clic en una tarjeta. Usa sus flechas para abrir padres, hermanos, pareja o hijos.</p>
    </aside>
  </main>

  <script>
    const svg = d3.select("svg");
    const g = svg.append("g");
    const rowLayer = g.append("g").attr("class", "row-layer");
    const linkLayer = g.append("g").attr("class", "link-layer");
    const nodeLayer = g.append("g").attr("class", "node-layer");

    const zoom = d3.zoom().scaleExtent([0.18, 2.4]).on("zoom", event => g.attr("transform", event.transform));
    svg.call(zoom);

    const cardWidth = 180;
    const cardHeight = 96;
    const xGap = 30;
    const yGap = 170;
    const topPad = 95;
    const leftPad = 150;

    let people = [];
    let byId = new Map();
    let rootId = null;
    let selectedId = null;
    let currentSearch = "";
    let dimensions = { width: 1200, height: 800 };
    const openState = new Map();

    const relationConfig = {
      parents:  { label: "Padres",   icon: "▲", dx: 0, dy: -(cardHeight / 2 + 14), linkClass: "parent-link" },
      children: { label: "Hijos",    icon: "▼", dx: 0, dy: cardHeight / 2 + 14, linkClass: "child-link" },
      siblings: { label: "Hermanos", icon: "▶", dx: cardWidth / 2 + 14, dy: 0, linkClass: "sibling-link" },
      spouses:  { label: "Pareja",   icon: "◀", dx: -(cardWidth / 2 + 14), dy: 0, linkClass: "spouse-link" }
    };

    function resize() {
      const container = document.getElementById("tree-container");
      const rect = container.getBoundingClientRect();
      svg.attr("width", rect.width).attr("height", rect.height);
    }
    window.addEventListener("resize", () => { resize(); update(); });

    const escapeHtml = value => String(value || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    function personClass(person) {
      if (person.gender === "Hombre") return "person-box male";
      if (person.gender === "Mujer") return "person-box female";
      return "person-box neutral";
    }

    function cleanIds(ids) {
      return [...new Set((ids || []).filter(id => byId.has(id)))];
    }

    function getOpen(id) {
      if (!openState.has(id)) {
        openState.set(id, { parents: false, children: false, siblings: false, spouses: false });
      }
      return openState.get(id);
    }

    function relationButtons(ids) {
      const persons = cleanIds(ids).map(id => byId.get(id));
      if (!persons.length) return '<p class="empty small">Sin registro</p>';
      return `<div class="relation-list">${persons.map(p => `<button data-person-id="${p.id}">${escapeHtml(p.name)}</button>`).join("")}</div>`;
    }

    function renderPanel(person) {
      const panel = document.getElementById("personPanel");
      if (!person) {
        panel.innerHTML = `<h2>Persona seleccionada</h2><p class="empty">Haz clic en una tarjeta. Usa sus flechas para abrir padres, hermanos, pareja o hijos.</p>`;
        return;
      }
      panel.innerHTML = `
        <h2>${escapeHtml(person.name)}</h2>
        <p class="muted">${escapeHtml([person.years, person.gender, `Nivel ${person.generation}`].filter(Boolean).join(" · "))}</p>
        <h3>Pareja</h3>${relationButtons(person.spouses)}
        <h3>Padres</h3>${relationButtons(person.parents)}
        <h3>Hermanos</h3>${relationButtons(person.siblings)}
        <h3>Hijos</h3>${relationButtons(person.children)}
      `;
      panel.querySelectorAll("button[data-person-id]").forEach(button => {
        button.addEventListener("click", () => selectPerson(button.dataset.personId, true));
      });
    }

    function wrapText(textSelection, maxWidth) {
      textSelection.each(function() {
        const text = d3.select(this);
        const words = (text.text() || "").split(/\s+/).reverse();
        let line = [];
        let lineNumber = 0;
        const lineHeight = 13;
        const y = Number(text.attr("y"));
        const x = Number(text.attr("x") || 0);
        text.text(null);
        let tspan = text.append("tspan").attr("x", x).attr("y", y);
        while (words.length) {
          const word = words.pop();
          line.push(word);
          tspan.text(line.join(" "));
          if (tspan.node().getComputedTextLength() > maxWidth && line.length > 1) {
            line.pop();
            tspan.text(line.join(" "));
            line = [word];
            tspan = text.append("tspan").attr("x", x).attr("y", y).attr("dy", `${++lineNumber * lineHeight}px`).text(word);
          }
        }
      });
    }


    function parseBirthRank(person) {
      const text = String(person.birthDate || person.birthdate || person.years || "").trim();
      if (!text) return Number.POSITIVE_INFINITY;
      const match = text.match(/(\d{4})/);
      return match ? Number(match[1]) : Number.POSITIVE_INFINITY;
    }

    function compareByBirthOrName(a, b) {
      const aBirth = parseBirthRank(a);
      const bBirth = parseBirthRank(b);
      if (aBirth !== bBirth) return aBirth - bBirth;
      return a.name.localeCompare(b.name, "es", { sensitivity: "base" });
    }

    function genderOrder(person) {
      if (person.gender === "Hombre") return 0;
      if (person.gender === "Mujer") return 1;
      return 2;
    }

    function comparePeople(a, b) {
      if (a.id === selectedId) return -1;
      if (b.id === selectedId) return 1;
      const aParents = cleanIds(a.parents).join(" ");
      const bParents = cleanIds(b.parents).join(" ");
      const parentCmp = aParents.localeCompare(bParents, "es");
      if (parentCmp) return parentCmp;
      const siblingCmp = compareByBirthOrName(a, b);
      if (siblingCmp) return siblingCmp;
      return a.name.localeCompare(b.name, "es", { sensitivity: "base" });
    }

    function orderRowWithCouples(row) {
      const ordered = [...row].sort(comparePeople);
      const used = new Set();
      const result = [];

      ordered.forEach(person => {
        if (used.has(person.id)) return;
        const spouse = cleanIds(person.spouses)
          .map(id => byId.get(id))
          .find(candidate => candidate && row.includes(candidate) && !used.has(candidate.id));

        if (spouse) {
          const pair = [person, spouse].sort((a, b) => genderOrder(a) - genderOrder(b) || comparePeople(a, b));
          pair.forEach(member => {
            used.add(member.id);
            result.push(member);
          });
          return;
        }

        used.add(person.id);
        result.push(person);
      });

      return result;
    }
    function visibleIdSet() {
      const ids = new Set();
      if (rootId) ids.add(rootId);
      if (selectedId) ids.add(selectedId);

      let changed = true;
      while (changed) {
        changed = false;
        [...ids].forEach(id => {
          const person = byId.get(id);
          if (!person) return;
          const state = getOpen(id);
          Object.keys(relationConfig).forEach(key => {
            if (!state[key]) return;
            cleanIds(person[key]).forEach(nextId => {
              if (!ids.has(nextId)) {
                ids.add(nextId);
                changed = true;
              }
            });
          });
        });
      }

      return ids;
    }

    function layoutVisiblePeople() {
      const ids = visibleIdSet();
      const visible = people.filter(p => ids.has(p.id));
      const generations = [...new Set(visible.map(p => p.generation))].sort((a, b) => b - a);
      const byGeneration = new Map(generations.map(gen => [gen, []]));

      visible.forEach(p => byGeneration.get(p.generation).push(p));
      generations.forEach(gen => {
        const row = byGeneration.get(gen);
        byGeneration.set(gen, orderRowWithCouples(row));
      });

      const maxRow = Math.max(...generations.map(gen => byGeneration.get(gen).length), 1);
      const rowWidth = maxRow * cardWidth + Math.max(0, maxRow - 1) * xGap;

      const minCenterGap = cardWidth + xGap;

      function distributeRowCenters(row, preserveCenter = true) {
        if (!row.length) return;
        row.sort((a, b) => a.x - b.x);
        for (let i = 1; i < row.length; i += 1) {
          row[i].x = Math.max(row[i].x, row[i - 1].x + minCenterGap);
        }
        for (let i = row.length - 2; i >= 0; i -= 1) {
          row[i].x = Math.min(row[i].x, row[i + 1].x - minCenterGap);
        }
        if (!preserveCenter) return;
        const first = row[0].x;
        const last = row[row.length - 1].x;
        const currentCenter = (first + last) / 2;
        const targetCenter = leftPad + rowWidth / 2;
        const shift = targetCenter - currentCenter;
        row.forEach(person => { person.x += shift; });
      }

      generations.forEach((gen, rowIndex) => {
        const row = byGeneration.get(gen);
        const thisRowWidth = row.length * cardWidth + Math.max(0, row.length - 1) * xGap;
        const startX = leftPad + (rowWidth - thisRowWidth) / 2 + cardWidth / 2;
        row.forEach((person, index) => {
          person.x = startX + index * (cardWidth + xGap);
          person.y = topPad + rowIndex * yGap;
        });
      });

      for (let pass = 0; pass < 3; pass += 1) {
        generations.forEach(gen => {
          const row = byGeneration.get(gen);
          row.forEach(parent => {
            const visibleChildren = cleanIds(parent.children).map(id => byId.get(id)).filter(child => ids.has(child.id));
            if (!visibleChildren.length) return;
            const childrenCenter = visibleChildren.reduce((sum, child) => sum + child.x, 0) / visibleChildren.length;
            parent.x = childrenCenter;
          });
          distributeRowCenters(row, true);
        });
      }

      dimensions = {
        width: leftPad * 2 + rowWidth,
        height: topPad + generations.length * yGap + 100,
        visible,
        generations,
        byGeneration
      };
      return visible;
    }

    function drawRows() {
      const rows = dimensions.generations.map(gen => ({ gen, y: topPad + dimensions.generations.indexOf(gen) * yGap }));
      const row = rowLayer.selectAll("line.generation-row").data(rows, d => d.gen);
      row.exit().remove();
      row.enter().append("line").attr("class", "generation-row").merge(row)
        .attr("x1", 30)
        .attr("x2", dimensions.width - 30)
        .attr("y1", d => d.y)
        .attr("y2", d => d.y);
    }

    function relationLinks(visible) {
      const ids = new Set(visible.map(p => p.id));
      const links = [];
      const seen = new Set();
      visible.forEach(person => {
        cleanIds(person.parents).forEach(parentId => {
          if (!ids.has(parentId)) return;
          const parent = byId.get(parentId);
          links.push({ source: parent, target: person, type: "parent" });
        });
        cleanIds(person.siblings).forEach(siblingId => {
          if (!ids.has(siblingId)) return;
          const sibling = byId.get(siblingId);
          const key = [person.id, sibling.id, "s"].sort().join("|");
          if (seen.has(key)) return;
          seen.add(key);
          links.push({ source: person, target: sibling, type: "sibling" });
        });
        cleanIds(person.spouses).forEach(spouseId => {
          if (!ids.has(spouseId)) return;
          const spouse = byId.get(spouseId);
          const key = [person.id, spouse.id, "p"].sort().join("|");
          if (seen.has(key)) return;
          seen.add(key);
          links.push({ source: person, target: spouse, type: "spouse" });
        });
      });
      return links;
    }

    function parentPath(d) {
      const sx = d.source.x;
      const sy = d.source.y + cardHeight / 2;
      const tx = d.target.x;
      const ty = d.target.y - cardHeight / 2;
      const midY = (sy + ty) / 2;
      return `M ${sx},${sy} C ${sx},${midY} ${tx},${midY} ${tx},${ty}`;
    }

    function horizontalPath(d) {
      const leftToRight = d.source.x < d.target.x;
      const sx = d.source.x + (leftToRight ? cardWidth / 2 : -cardWidth / 2);
      const tx = d.target.x + (leftToRight ? -cardWidth / 2 : cardWidth / 2);
      const sy = d.source.y;
      const ty = d.target.y;
      const curve = Math.max(36, Math.abs(tx - sx) / 3);
      return `M ${sx},${sy} C ${sx + (leftToRight ? curve : -curve)},${sy} ${tx - (leftToRight ? curve : -curve)},${ty} ${tx},${ty}`;
    }

    function drawLinks(visible) {
      const links = relationLinks(visible);
      const paths = linkLayer.selectAll("path.relation-link").data(links, d => `${d.type}-${d.source.id}-${d.target.id}`);
      paths.exit().remove();
      paths.enter().append("path").attr("class", "relation-link").merge(paths)
        .attr("class", d => `relation-link ${d.type}-link`)
        .attr("d", d => d.type === "parent" ? parentPath(d) : horizontalPath(d));
    }

    function drawNodes(visible) {
      const search = currentSearch.toLowerCase();
      const node = nodeLayer.selectAll("g.person-card").data(visible, d => d.id);
      node.exit().remove();

      const enter = node.enter().append("g")
        .attr("class", "person-card")
        .on("click", (event, d) => selectPerson(d.id, false));

      enter.append("rect")
        .attr("x", -cardWidth / 2)
        .attr("y", -cardHeight / 2)
        .attr("width", cardWidth)
        .attr("height", cardHeight)
        .attr("rx", 18)
        .attr("ry", 18);

      enter.append("text")
        .attr("class", "person-name")
        .attr("text-anchor", "middle")
        .attr("x", 0)
        .attr("y", -23)
        .text(d => d.name)
        .call(wrapText, cardWidth - 34);

      enter.append("text")
        .attr("class", "person-info")
        .attr("text-anchor", "middle")
        .attr("x", 0)
        .attr("y", 20);

      Object.entries(relationConfig).forEach(([key, cfg]) => {
        const arrow = enter.append("g")
          .attr("class", `relation-toggle toggle-${key}`)
          .attr("transform", `translate(${cfg.dx},${cfg.dy})`)
          .on("click", (event, d) => {
            event.stopPropagation();
            const state = getOpen(d.id);
            state[key] = !state[key];
            selectedId = d.id;
            renderPanel(d);
            update();
            centerOn(d);
          });
        arrow.append("circle").attr("r", 10);
        arrow.append("text").attr("text-anchor", "middle").attr("dominant-baseline", "central").text(cfg.icon);
        arrow.append("title").text(cfg.label);
      });

      const merged = enter.merge(node)
        .attr("transform", d => `translate(${d.x},${d.y})`)
        .classed("selected", d => d.id === selectedId)
        .classed("highlight", d => search && d.name.toLowerCase().includes(search));

      merged.select("rect").attr("class", d => personClass(d));
      merged.select(".person-info").text(d => d.years || "");

      Object.keys(relationConfig).forEach(key => {
        merged.select(`.toggle-${key}`)
          .style("display", d => cleanIds(d[key]).length ? "block" : "none")
          .classed("open", d => getOpen(d.id)[key]);
      });
    }

    function update() {
      const visible = layoutVisiblePeople();
      drawRows();
      drawLinks(visible);
      drawNodes(visible);
      setToggleAllButtonLabel();
    }


    function setToggleAllButtonLabel() {
      const button = document.getElementById("toggleAllRelations");
      if (!button) return;
      const hasExpandable = people.some(person => Object.keys(relationConfig).some(key => cleanIds(person[key]).length));
      if (!hasExpandable) {
        button.disabled = true;
        button.textContent = "Sin relaciones";
        return;
      }
      const allOpen = people.every(person => Object.keys(relationConfig).every(key => !cleanIds(person[key]).length || getOpen(person.id)[key]));
      button.disabled = false;
      button.textContent = allOpen ? "Minimizar todo" : "Expandir todo";
    }

    function toggleAllRelations() {
      const allOpen = people.every(person => Object.keys(relationConfig).every(key => !cleanIds(person[key]).length || getOpen(person.id)[key]));
      people.forEach(person => {
        const state = getOpen(person.id);
        Object.keys(relationConfig).forEach(key => {
          if (cleanIds(person[key]).length) state[key] = !allOpen;
        });
      });
      update();
      if (selectedId && byId.has(selectedId)) renderPanel(byId.get(selectedId));
    }

    function selectPerson(id, center = false) {
      if (!byId.has(id)) return;
      selectedId = id;
      const person = byId.get(id);
      renderPanel(person);
      update();
      if (center) centerOn(person);
    }

    function centerOn(person) {
      const svgNode = svg.node();
      const width = svgNode.clientWidth || 1000;
      const height = svgNode.clientHeight || 700;
      const scale = 0.9;
      svg.transition().duration(420).call(
        zoom.transform,
        d3.zoomIdentity.translate(width / 2 - person.x * scale, height / 2 - person.y * scale).scale(scale)
      );
    }

    function centerView() {
      const svgNode = svg.node();
      const scale = Math.min(0.95, Math.max(0.28, (svgNode.clientWidth || 1000) / Math.max(dimensions.width, 1)));
      svg.transition().duration(420).call(zoom.transform, d3.zoomIdentity.translate(40, 42).scale(scale));
    }

    fetch("family.json")
      .then(response => response.json())
      .then(data => {
        people = (data.people || []).filter(person => Number.isFinite(person.generation));
        byId = new Map(people.map(person => [person.id, person]));
        people.forEach(person => {
          ["parents", "children", "siblings", "spouses"].forEach(key => person[key] = cleanIds(person[key]));
        });
        rootId = data.rootId || people.find(p => p.name === "Edgar Yael Miranda Islas")?.id || people[0]?.id;
        selectedId = rootId;
        document.getElementById("peopleCounter").textContent = `${people.length} personas con nivel confirmado`;
        resize();
        update();
        if (rootId) {
          renderPanel(byId.get(rootId));
          centerOn(byId.get(rootId));
        }

        document.getElementById("toggleAllRelations").addEventListener("click", toggleAllRelations);
        document.getElementById("resetView").addEventListener("click", centerView);
        document.getElementById("searchPerson").addEventListener("input", event => {
          currentSearch = event.target.value.trim();
          if (currentSearch.length >= 3) {
            const match = people.find(person => person.name.toLowerCase().includes(currentSearch.toLowerCase()));
            if (match) selectPerson(match.id, true);
          } else {
            update();
          }
        });
      })
      .catch(error => {
        document.getElementById("peopleCounter").textContent = "No se pudo cargar family.json";
        console.error(error);
      });
  </script>
</body>
</html>
