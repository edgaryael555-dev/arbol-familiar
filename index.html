<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Árbol Genealógico Interactivo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg: #f5f1ea;
    --bg-2: #efe9df;
    --ink: #2a2724;
    --ink-soft: #6b6358;
    --line: #c7bca9;
    --line-strong: #8b7d68;
    --card: #ffffff;
    --card-border: #e3dccf;
    --accent: #8b6f47;
    --accent-soft: #c9a878;
    --focus: #2c4a6b;
    --rose: #b8607a;
    --rose-soft: #e8a9b8;
    --shadow: 0 1px 2px rgba(43,39,36,.06), 0 4px 16px rgba(43,39,36,.06);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background: var(--bg); color: var(--ink);
    font-family: 'Inter','Helvetica Neue',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing: antialiased; overflow:hidden; }

  header {
    position: fixed; top:0; left:0; right:0; z-index:30;
    display:flex; align-items:center; justify-content:space-between; gap: 12px;
    padding: 12px 22px;
    background: rgba(245,241,234,.86);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--card-border);
  }
  header h1 {
    margin:0; font-size: 15px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--ink); white-space: nowrap;
  }
  header h1 span { color: var(--accent); font-weight:500; margin-left:8px; letter-spacing:0; text-transform: none; font-size: 13px; }
  .controls { display:flex; align-items:center; gap:8px; flex-wrap: wrap; }
  .divider { width:1px; height:24px; background: var(--card-border); }
  .search-wrap { position: relative; }
  .search-wrap input {
    width: 220px; padding: 8px 12px 8px 32px; border:1px solid var(--card-border);
    background: #fff; border-radius: 999px; font-size: 13px; color: var(--ink);
    outline:none; transition: border-color .15s, box-shadow .15s;
  }
  .search-wrap input:focus { border-color: var(--accent-soft); box-shadow: 0 0 0 3px rgba(201,168,120,.18); }
  .search-wrap svg.icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; color: var(--ink-soft); }
  .suggestions {
    position:absolute; top: 38px; left:0; right:0; background:#fff;
    border:1px solid var(--card-border); border-radius: 10px; box-shadow: var(--shadow);
    max-height: 320px; overflow:auto; z-index: 40; display:none;
  }
  .suggestions.open { display:block; }
  .suggestions div { padding:8px 12px; font-size:13px; cursor:pointer; }
  .suggestions div:hover, .suggestions div.active { background: var(--bg-2); }
  .suggestions .gen-tag { font-size:10px; color: var(--ink-soft); margin-left:6px; }
  button.btn {
    padding: 7px 12px; font-size:12px; font-weight:500; letter-spacing:.04em;
    background: #fff; color: var(--ink); border:1px solid var(--card-border);
    border-radius: 8px; cursor:pointer; transition: all .15s;
    display:inline-flex; align-items:center; gap:6px; white-space: nowrap;
  }
  button.btn:hover { background: var(--bg-2); border-color: var(--line-strong); }
  button.btn.primary { background: var(--ink); color:#fff; border-color: var(--ink); }
  button.btn.primary:hover { background:#3d3934; }
  button.btn svg { width:13px; height:13px; }

  .canvas-host {
    position: absolute; top: 56px; left: 0; right: 0; bottom: 0;
    overflow: hidden; cursor: grab;
    background-image: radial-gradient(circle at 1px 1px, rgba(139,125,104,.18) 1px, transparent 0);
    background-size: 28px 28px;
    transition: right .25s ease;
  }
  body.panel-open .canvas-host { right: 340px; }
  .canvas-host.panning { cursor: grabbing; }
  .canvas {
    position: absolute; top: 0; left: 0;
    transform-origin: 0 0;
    will-change: transform;
  }
  svg.lines { position:absolute; top:0; left:0; pointer-events:none; overflow: visible; }
  svg.lines path { fill: none; stroke: var(--line-strong); stroke-width: 1.2; }
  svg.lines path.couple { stroke: var(--rose-soft); stroke-width: 1.4; }
  svg.lines path.sibling { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; }
  svg.lines .heart-bg { fill: #fff; stroke: var(--rose-soft); stroke-width: 1; }
  svg.lines .heart    { fill: var(--rose); }

  .gen-rail { position: absolute; top: 0; left: 0; pointer-events: none; }
  .gen-rail .row {
    position: absolute; left: 0; right: 0; height: 0;
    border-top: 1px dashed rgba(184,173,151,.35);
  }
  .gen-rail .label {
    position: absolute; left: 12px; padding: 2px 9px;
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-soft); background: rgba(245,241,234,.9);
    border: 1px solid var(--card-border); border-radius: 999px;
    transform: translateY(-50%);
  }

  .card {
    position: absolute; width: 200px; min-height: 64px;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 12px; box-shadow: var(--shadow);
    padding: 11px 14px; transition: box-shadow .2s, transform .25s ease, top .25s ease, left .25s ease, border-color .15s;
  }
  .card:hover { box-shadow: 0 1px 2px rgba(43,39,36,.08), 0 8px 24px rgba(43,39,36,.10); }
  .card.focused { border-color: var(--focus); box-shadow: 0 0 0 2px rgba(44,74,107,.15), 0 8px 24px rgba(44,74,107,.12); }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(139,111,71,.15), 0 8px 24px rgba(139,111,71,.10); }
  .card.placeholder { background: #faf7f1; border-style: dashed; opacity: .85; }
  .card .name {
    font-size: 13px; font-weight: 600; line-height: 1.25; color: var(--ink);
    word-wrap: break-word; cursor: pointer;
  }
  .card .meta {
    margin-top: 4px; font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-soft);
  }
  .card .meta .dot { display:inline-block; width:5px; height:5px; border-radius:50%; margin: 0 6px 2px 0; vertical-align: middle; }
  .card[data-sex="M"] .meta .dot { background: #5b7c99; }
  .card[data-sex="F"] .meta .dot { background: var(--rose); }
  .card .meta .dates { margin-left: 8px; color: var(--ink-soft); letter-spacing: .04em; text-transform: none; font-weight:500; font-size: 10.5px; }

  .btn-edge {
    position: absolute; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; color: var(--ink); border: 1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(43,39,36,.10);
    opacity: 0; transition: opacity .15s, transform .15s, background .15s, color .15s;
    user-select:none; z-index: 5;
  }
  .btn-edge svg { width: 12px; height: 12px; pointer-events:none; }
  .btn-edge:hover { background: var(--ink); color:#fff; border-color: var(--ink); transform: scale(1.08); }
  .card:hover .btn-edge, .card.focused .btn-edge, .card.selected .btn-edge { opacity: 1; }
  .btn-edge.minus { background: var(--ink); color:#fff; border-color: var(--ink); }
  .btn-edge.minus:hover { background: var(--accent); border-color: var(--accent); }

  .btn-up    { top: -11px; left: 50%; transform: translateX(-50%); }
  .btn-down  { bottom: -11px; left: 50%; transform: translateX(-50%); }
  .btn-left  { left: -11px; top: 50%; transform: translateY(-50%); }
  .btn-right { right: -11px; top: 50%; transform: translateY(-50%); }
  .btn-edge.btn-up:hover    { transform: translateX(-50%) scale(1.08); }
  .btn-edge.btn-down:hover  { transform: translateX(-50%) scale(1.08); }
  .btn-edge.btn-left:hover  { transform: translateY(-50%) scale(1.08); }
  .btn-edge.btn-right:hover { transform: translateY(-50%) scale(1.08); }

  .empty-hint {
    position: fixed; bottom: 22px; right: 22px; max-width: 280px;
    background: rgba(255,255,255,.92); border: 1px solid var(--card-border);
    border-radius: 12px; padding: 11px 14px; font-size: 12px; color: var(--ink-soft);
    box-shadow: var(--shadow); line-height: 1.5; z-index: 5;
    transition: right .25s ease;
  }
  body.panel-open .empty-hint { right: 360px; }
  .empty-hint b { color: var(--ink); font-weight:600; }
  .empty-hint .key { display:inline-block; padding: 1px 6px; border-radius:4px; background: var(--bg-2); border:1px solid var(--card-border); font-family: ui-monospace,monospace; font-size: 10.5px; color: var(--ink); }

  .zoom-controls {
    position: fixed; bottom: 22px; left: 22px;
    display:flex; flex-direction:column; gap:6px;
    background: rgba(255,255,255,.92); border:1px solid var(--card-border);
    border-radius: 10px; padding: 6px; box-shadow: var(--shadow); z-index: 5;
  }
  .zoom-controls button {
    width: 28px; height: 28px; background: transparent; border: none;
    border-radius: 6px; font-size: 16px; line-height:1; color: var(--ink);
    cursor: pointer; display:flex; align-items:center; justify-content:center;
  }
  .zoom-controls button:hover { background: var(--bg-2); }

  /* ----------- Side panel ----------- */
  .side-panel {
    position: fixed; top: 56px; right: 0; bottom: 0; width: 340px; z-index: 20;
    background: #fffefb; border-left: 1px solid var(--card-border);
    box-shadow: -4px 0 18px rgba(43,39,36,.06);
    transform: translateX(100%); transition: transform .25s ease;
    display: flex; flex-direction: column;
  }
  body.panel-open .side-panel { transform: translateX(0); }
  .side-panel .close {
    position: absolute; top: 12px; right: 12px; width: 28px; height: 28px;
    border: none; background: transparent; font-size: 22px; line-height: 1;
    color: var(--ink-soft); border-radius: 6px; cursor: pointer;
  }
  .side-panel .close:hover { background: var(--bg-2); color: var(--ink); }
  .side-panel .panel-header { padding: 22px 24px 14px; border-bottom: 1px solid var(--card-border); }
  .side-panel .panel-name { margin: 0; font-size: 19px; font-weight: 600; line-height: 1.25; color: var(--ink); padding-right: 32px; }
  .side-panel .panel-tags { margin-top: 10px; display:flex; flex-wrap: wrap; gap: 6px; }
  .side-panel .tag {
    font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-soft); padding: 3px 9px; border-radius: 999px;
    background: var(--bg-2); border: 1px solid var(--card-border);
  }
  .side-panel .tag.gender-M { color: #4a6680; background: #e8eef4; border-color: #d0dce8; }
  .side-panel .tag.gender-F { color: var(--rose); background: #f8e9ee; border-color: #f0d4dc; }
  .side-panel .panel-body { padding: 18px 24px 28px; overflow-y: auto; flex: 1; }
  .side-panel .section { margin-bottom: 18px; }
  .side-panel .section-title {
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-soft); margin-bottom: 8px; font-weight: 600;
  }
  .side-panel .value { font-size: 13px; color: var(--ink); line-height: 1.5; }
  .side-panel .value.muted { color: var(--ink-soft); font-style: italic; }
  .side-panel .chips { display:flex; flex-wrap: wrap; gap: 6px; }
  .side-panel .chip {
    display:inline-flex; align-items:center; gap: 5px;
    font-size: 12px; padding: 5px 10px; border-radius: 999px;
    background: #fff; border: 1px solid var(--card-border); color: var(--ink);
    cursor: pointer; transition: all .15s; max-width: 100%;
  }
  .side-panel .chip:hover { border-color: var(--accent-soft); background: var(--bg-2); }
  .side-panel .chip.placeholder { opacity: .65; font-style: italic; }
  .side-panel .chip .sex-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .side-panel .chip .sex-dot.M { background: #5b7c99; }
  .side-panel .chip .sex-dot.F { background: var(--rose); }
  .side-panel .chip .name-text { white-space: nowrap; overflow:hidden; text-overflow: ellipsis; max-width: 230px; }

  @media (max-width: 720px) {
    header { padding: 10px 14px; }
    header h1 span { display: none; }
    .search-wrap input { width: 140px; }
    .empty-hint { display: none; }
    .side-panel { width: 100%; }
    body.panel-open .canvas-host { right: 0; }
  }
</style>
</head>
<body>

<header>
  <h1>Árbol Genealógico <span>·  Familia</span></h1>
  <div class="controls">
    <button class="btn" id="btn-expand-all" title="Expandir todo el árbol">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M12 3v18M5.5 5.5l13 13M18.5 5.5l-13 13"/></svg>
      Expandir todo
    </button>
    <button class="btn" id="btn-collapse-all" title="Colapsar todo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
      Minimizar todo
    </button>
    <div class="divider"></div>
    <div class="search-wrap">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="search" type="text" placeholder="Buscar persona..." autocomplete="off">
      <div id="suggestions" class="suggestions"></div>
    </div>
    <button class="btn" id="btn-fit">Centrar</button>
    <button class="btn" id="btn-reset">Reiniciar</button>
  </div>
</header>

<div id="canvas-host" class="canvas-host">
  <div id="canvas" class="canvas">
    <div id="rail" class="gen-rail"></div>
    <svg id="lines" class="lines"></svg>
    <div id="cards"></div>
  </div>
</div>

<div class="zoom-controls">
  <button id="zoom-in" title="Acercar">+</button>
  <button id="zoom-out" title="Alejar">−</button>
  <button id="zoom-reset" title="Restablecer">⟲</button>
</div>

<div class="empty-hint">
  Pasa el cursor sobre una tarjeta y usa los botones <b>+</b> de cada lado para expandir y <b>−</b> para minimizar. Clic en el nombre abre el panel de información. Arrastra para moverte.
</div>

<aside class="side-panel" id="panel">
  <div class="panel-header">
    <button class="close" id="panel-close" aria-label="cerrar">×</button>
    <h2 class="panel-name" id="panel-name">—</h2>
    <div class="panel-tags" id="panel-tags"></div>
  </div>
  <div class="panel-body">
    <div class="section">
      <div class="section-title">Fechas</div>
      <div id="panel-dates" class="value muted">No disponibles</div>
    </div>
    <div class="section">
      <div class="section-title">Pareja</div>
      <div id="panel-pareja" class="chips"></div>
    </div>
    <div class="section">
      <div class="section-title">Padres</div>
      <div id="panel-padres" class="chips"></div>
    </div>
    <div class="section">
      <div class="section-title">Hijos</div>
      <div id="panel-hijos" class="chips"></div>
    </div>
    <div class="section">
      <div class="section-title">Hermanos</div>
      <div id="panel-hermanos" class="chips"></div>
    </div>
  </div>
</aside>

  else rels = [...info.p, ...info.h];
  if (!rels || rels.length === 0) return 'hidden';
  const allVis = rels.every(r => isVis(r));
  return allVis ? 'minimize' : 'expand';
}

// ---------- Layout por filas ----------
function layoutRow(gen) {
  const inRow = [...state.visible.entries()].filter(([_,v]) => v.gen === gen);
  if (!inRow.length) return;

  // Construir unidades pareja
  const idToUnit = new Map();
  const units = [];
  inRow.forEach(([id, v]) => {
    if (idToUnit.has(id)) return;
    const unit = { ids: [id] };
    PEOPLE[id].p.forEach(pid => {
      if (isVis(pid) && state.visible.get(pid).gen === gen && !idToUnit.has(pid)) {
        unit.ids.push(pid);
      }
    });
    unit.ids.forEach(m => idToUnit.set(m, unit));
    unit.anchorX = unit.ids.reduce((s,m) => s + state.visible.get(m).x, 0) / unit.ids.length;
    units.push(unit);
  });

  // Ordenar unidades por anchorX
  units.sort((a,b) => a.anchorX - b.anchorX);

  // Dentro de cada unidad: hombre primero
  units.forEach(u => {
    u.ids.sort((a,b) => {
      const ga = PEOPLE[a].s, gb = PEOPLE[b].s;
      if (ga === 'M' && gb === 'F') return -1;
      if (ga === 'F' && gb === 'M') return 1;
      return 0;
    });
  });

  // Asignar posiciones evitando solape
  let cursor = -Infinity;
  units.forEach(u => {
    let startX = u.anchorX - ((u.ids.length - 1) / 2) * COL_W;
    if (startX < cursor) startX = cursor;
    u.ids.forEach((id, i) => {
      state.visible.get(id).x = startX + i * COL_W;
    });
    cursor = startX + u.ids.length * COL_W;
  });
}

function layoutAllRows() {
  const gens = [...new Set([...state.visible.values()].map(v => v.gen))];
  gens.forEach(layoutRow);
}

// ---------- Acciones ----------
function focusOn(id, opts = {}) {
  if (!PEOPLE[id]) return;
  const reset = opts.reset !== false;
  if (reset) {
    state.visible.clear();
    state.visible.set(id, { gen: PEOPLE[id].g, x: 0, addedBy: null });
    if (PEOPLE[id].pa.length) expandUp(id, true);
  }
  state.focused = id;
  state.selected = id;
  render();
  centerOn(id);
  openPanel(id);
}

function expandUp(id, silent) {
  const info = PEOPLE[id]; if (!info) return;
  const me = state.visible.get(id); if (!me) return;
  const newParents = info.pa.filter(pid => PEOPLE[pid] && !isVis(pid));
  if (!newParents.length) { if (!silent) render(); return; }
  newParents.sort((a,b) => {
    const ga = PEOPLE[a].s, gb = PEOPLE[b].s;
    if (ga === 'M' && gb === 'F') return -1;
    if (ga === 'F' && gb === 'M') return 1;
    return 0;
  });
  const startX = me.x - ((newParents.length - 1) / 2) * COL_W;
  newParents.forEach((pid, i) => {
    state.visible.set(pid, { gen: PEOPLE[pid].g, x: startX + i * COL_W, addedBy: { by: id, dir: 'up' } });
  });
  layoutAllRows();
  if (!silent) render();
}

function expandDown(id, silent) {
  const info = PEOPLE[id]; if (!info) return;
  const me = state.visible.get(id); if (!me) return;
  const visPartner = info.p.find(pid => isVis(pid) && state.visible.get(pid).gen === me.gen);
  let center = me.x;
  if (visPartner) center = (me.x + state.visible.get(visPartner).x) / 2;
  const newKids = info.c.filter(cid => PEOPLE[cid] && !isVis(cid));
  if (!newKids.length) { if (!silent) render(); return; }
  const startX = center - ((newKids.length - 1) / 2) * COL_W;
  newKids.forEach((cid, i) => {
    state.visible.set(cid, { gen: PEOPLE[cid].g, x: startX + i * COL_W, addedBy: { by: id, dir: 'down' } });
  });
  layoutAllRows();
  if (!silent) render();
}

function expandSide(id, silent) {
  const info = PEOPLE[id]; if (!info) return;
  const me = state.visible.get(id); if (!me) return;

  // Determinar dirección "hacia afuera" para los hermanos
  const visPartner = info.p.find(pid => isVis(pid) && state.visible.get(pid).gen === me.gen);
  let outward; // -1 izq, +1 der
  if (visPartner) {
    const px = state.visible.get(visPartner).x;
    outward = px < me.x ? +1 : -1;  // hermanos al lado opuesto a la pareja
  } else {
    // Sin pareja visible: si soy mujer, hermanos a la derecha; si hombre, a la izquierda
    outward = info.s === 'F' ? +1 : -1;
  }

  // Añadir parejas faltantes (ubicación según género: H izq, M der)
  info.p.forEach(pid => {
    if (PEOPLE[pid] && !isVis(pid)) {
      const pGender = PEOPLE[pid].s;
      const px = pGender === 'F' ? me.x + COL_W * 0.5 : me.x - COL_W * 0.5;
      state.visible.set(pid, { gen: PEOPLE[pid].g, x: px, addedBy: { by: id, dir: 'side' } });
    }
  });

  // Añadir hermanos hacia afuera
  let offset = COL_W * 1.4;
  info.h.forEach(sid => {
    if (PEOPLE[sid] && !isVis(sid)) {
      state.visible.set(sid, { gen: PEOPLE[sid].g, x: me.x + outward * offset, addedBy: { by: id, dir: 'side' } });
      offset += COL_W;
    }
  });

  layoutAllRows();
  if (!silent) render();
}

function minimize(id, dir) {
  // Eliminar todas las personas visibles cuyo addedBy sea este (id, dir),
  // y recursivamente sus descendientes en el árbol de "addedBy".
  const directRemovals = new Set();
  for (const [pid, v] of state.visible) {
    if (v.addedBy && v.addedBy.by === id && v.addedBy.dir === dir) directRemovals.add(pid);
  }
  // Cierre transitivo
  const toRemove = new Set(directRemovals);
  let changed = true;
  while (changed) {
    changed = false;
    for (const [pid, v] of state.visible) {
      if (toRemove.has(pid)) continue;
      if (v.addedBy && toRemove.has(v.addedBy.by)) {
        toRemove.add(pid); changed = true;
      }
    }
  }
  // No eliminar la persona enfocada por error
  if (state.focused) toRemove.delete(state.focused);
  toRemove.forEach(pid => state.visible.delete(pid));
  layoutAllRows();
  render();
}

function expandAll() {
  let safety = 50, added = true;
  while (added && safety-- > 0) {
    added = false;
    for (const id of [...state.visible.keys()]) {
      const info = PEOPLE[id];
      if (info.pa.some(p => PEOPLE[p] && !isVis(p))) { expandUp(id, true); added = true; }
      if (info.c.some(c => PEOPLE[c] && !isVis(c)))  { expandDown(id, true); added = true; }
      const sideMissing = [...info.p, ...info.h].some(x => PEOPLE[x] && !isVis(x));
      if (sideMissing) { expandSide(id, true); added = true; }
    }
  }
  render();
}

function collapseAll() {
  if (!state.focused) return;
  const f = state.focused;
  const fInfo = state.visible.get(f) || { gen: PEOPLE[f].g, x: 0, addedBy: null };
  state.visible.clear();
  state.visible.set(f, { gen: PEOPLE[f].g, x: 0, addedBy: null });
  render();
  centerOn(f);
}

// ---------- Render ----------
const cardsEl = document.getElementById('cards');
const linesEl = document.getElementById('lines');
const railEl  = document.getElementById('rail');

const ICON_PLUS  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const ICON_MINUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg>';

function render() {
  const arr = [...state.visible.entries()];
  if (arr.length === 0) { cardsEl.innerHTML=''; linesEl.innerHTML=''; railEl.innerHTML=''; return; }

  const xs = arr.map(([_,v]) => v.x);
  const ys = arr.map(([_,v]) => genToY(v.gen));
  const minX = Math.min(...xs) - 80, maxX = Math.max(...xs) + CARD_W + 80;
  const minY = Math.min(...ys) - 80, maxY = Math.max(...ys) + CARD_H + 80;
  const W = maxX - minX, H = maxY - minY;

  const toPx = (id) => {
    const v = state.visible.get(id);
    return { x: v.x - minX, y: genToY(v.gen) - minY };
  };

  // Cards
  cardsEl.innerHTML = '';
  for (const [id, v] of arr) {
    const info = PEOPLE[id];
    const {x,y} = toPx(id);
    const div = document.createElement('div');
    div.className = 'card';
    if (info._placeholder) div.classList.add('placeholder');
    if (id === state.focused) div.classList.add('focused');
    if (id === state.selected && id !== state.focused) div.classList.add('selected');
    div.style.left = x + 'px';
    div.style.top  = y + 'px';
    div.dataset.id = id;
    div.dataset.sex = info.s || 'M';

    // Estado de cada dirección
    const dUp = dirState(id, 'up');
    const dDown = dirState(id, 'down');
    const dSide = dirState(id, 'side');

    const dates = (info.b || info.d) ? `<span class="dates">${escapeHtml(info.b||'?')}${(info.b||info.d)?' – ':''}${escapeHtml(info.d||'')}</span>` : '';

    div.innerHTML = `
      <div class="name" data-action="open">${escapeHtml(id)}</div>
      <div class="meta"><span class="dot"></span>Generación ${info.g}${dates}</div>
      ${dUp !== 'hidden'   ? `<button class="btn-edge btn-up   ${dUp==='minimize'?'minus':''}"   data-act="up"   title="${dUp==='minimize'?'Ocultar padres':'Mostrar padres'}">${dUp==='minimize'?ICON_MINUS:ICON_PLUS}</button>` : ''}
      ${dDown !== 'hidden' ? `<button class="btn-edge btn-down ${dDown==='minimize'?'minus':''}" data-act="down" title="${dDown==='minimize'?'Ocultar hijos':'Mostrar hijos'}">${dDown==='minimize'?ICON_MINUS:ICON_PLUS}</button>` : ''}
      ${dSide !== 'hidden' ? `<button class="btn-edge btn-left ${dSide==='minimize'?'minus':''}" data-act="side" title="${dSide==='minimize'?'Ocultar pareja y hermanos':'Mostrar pareja y hermanos'}">${dSide==='minimize'?ICON_MINUS:ICON_PLUS}</button>` : ''}
      ${dSide !== 'hidden' ? `<button class="btn-edge btn-right ${dSide==='minimize'?'minus':''}" data-act="side" title="${dSide==='minimize'?'Ocultar pareja y hermanos':'Mostrar pareja y hermanos'}">${dSide==='minimize'?ICON_MINUS:ICON_PLUS}</button>` : ''}
    `;

    div.addEventListener('click', (e) => {
      if (e.target.closest('.btn-edge')) return;
      state.selected = id;
      openPanel(id);
      render();
    });

    div.querySelectorAll('.btn-edge').forEach(b => {
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        const act = b.dataset.act;
        const ds = dirState(id, act);
        state.selected = id;
        if (ds === 'minimize') {
          minimize(id, act);
        } else {
          if (act === 'up') expandUp(id);
          else if (act === 'down') expandDown(id);
          else expandSide(id);
        }
      });
    });

    cardsEl.appendChild(div);
  }

  // SVG líneas
  linesEl.setAttribute('width', W);
  linesEl.setAttribute('height', H);
  linesEl.style.width = W + 'px';
  linesEl.style.height = H + 'px';
  let svg = '';

  // Parejas: línea + corazón
  const drawnCouples = new Set();
  for (const [id, v] of arr) {
    PEOPLE[id].p.forEach(pid => {
      if (!isVis(pid)) return;
      const key = [id, pid].sort().join('||');
      if (drawnCouples.has(key)) return;
      drawnCouples.add(key);
      const a = toPx(id), b = toPx(pid);
      const ay = a.y + CARD_H/2, by = b.y + CARD_H/2;
      if (Math.abs(ay - by) > 2) return;
      const x1 = Math.min(a.x + CARD_W, b.x + CARD_W);
      const x2 = Math.max(a.x, b.x);
      if (x2 <= x1) return;
      const midX = (x1 + x2) / 2;
      svg += `<path class="couple" d="M ${x1} ${ay} L ${x2} ${ay}"/>`;
      svg += `<circle class="heart-bg" cx="${midX}" cy="${ay}" r="9"/>`;
      // Heart path centered at (midX, ay), 12px wide
      svg += `<path class="heart" d="M ${midX} ${ay+4}
        C ${midX-6} ${ay+1} ${midX-6} ${ay-4} ${midX-3} ${ay-4}
        C ${midX-1.2} ${ay-4} ${midX} ${ay-2} ${midX} ${ay-2}
        C ${midX} ${ay-2} ${midX+1.2} ${ay-4} ${midX+3} ${ay-4}
        C ${midX+6} ${ay-4} ${midX+6} ${ay+1} ${midX} ${ay+4} Z"/>`;
    });
  }

  // Hermanos: línea sutil
  const drawnSibs = new Set();
  for (const [id, v] of arr) {
    PEOPLE[id].h.forEach(hid => {
      if (!isVis(hid)) return;
      const key = [id, hid].sort().join('||');
      if (drawnSibs.has(key)) return;
      drawnSibs.add(key);
      // Skip si comparten al menos un padre visible (la línea padre→hijo ya conecta)
      const sharedParents = PEOPLE[id].pa.filter(p => PEOPLE[hid] && PEOPLE[hid].pa.includes(p) && isVis(p));
      if (sharedParents.length) return;
      const a = toPx(id), b = toPx(hid);
      const ay = a.y + CARD_H/2, by = b.y + CARD_H/2;
      if (Math.abs(ay - by) > 2) return;
      const x1 = Math.min(a.x + CARD_W, b.x + CARD_W);
      const x2 = Math.max(a.x, b.x);
      if (x2 <= x1) return;
      svg += `<path class="sibling" d="M ${x1} ${ay} L ${x2} ${ay}"/>`;
    });
  }

  // Padre→hijo
  for (const [id, v] of arr) {
    const info = PEOPLE[id];
    const visParents = info.pa.filter(isVis);
    if (visParents.length === 0) continue;
    const child = toPx(id);
    const childTop = { x: child.x + CARD_W/2, y: child.y };
    let origin;
    if (visParents.length >= 2) {
      const a = toPx(visParents[0]); const b = toPx(visParents[1]);
      origin = { x: (a.x + b.x)/2 + CARD_W/2, y: Math.max(a.y, b.y) + CARD_H };
    } else {
      const a = toPx(visParents[0]);
      origin = { x: a.x + CARD_W/2, y: a.y + CARD_H };
    }
    const midY = (origin.y + childTop.y) / 2;
    svg += `<path d="M ${origin.x} ${origin.y} L ${origin.x} ${midY} L ${childTop.x} ${midY} L ${childTop.x} ${childTop.y}"/>`;
  }

  linesEl.innerHTML = svg;

  // Rail generaciones
  railEl.innerHTML = '';
  railEl.style.width = W + 'px'; railEl.style.height = H + 'px';
  const visibleGens = [...new Set(arr.map(([_,v]) => v.gen))].sort((a,b)=>a-b);
  visibleGens.forEach(g => {
    const yCenter = genToY(g) - minY + CARD_H/2;
    const row = document.createElement('div');
    row.className = 'row'; row.style.top = yCenter + 'px';
    railEl.appendChild(row);
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = `Generación ${g}`;
    label.style.top = yCenter + 'px';
    railEl.appendChild(label);
  });

  applyTransform();
}

// ---------- Pan & Zoom ----------
const host = document.getElementById('canvas-host');
const canvas = document.getElementById('canvas');

function applyTransform() {
  canvas.style.transform = `translate(${state.pan.x}px, ${state.pan.y}px) scale(${state.zoom})`;
}

let dragging = false, dragStart = null;
host.addEventListener('mousedown', (e) => {
  if (e.target.closest('.card') || e.target.closest('button')) return;
  dragging = true; host.classList.add('panning');
  dragStart = { x: e.clientX - state.pan.x, y: e.clientY - state.pan.y };
});
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  state.pan.x = e.clientX - dragStart.x;
  state.pan.y = e.clientY - dragStart.y;
  applyTransform();
});
window.addEventListener('mouseup', () => { dragging = false; host.classList.remove('panning'); });

host.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = -e.deltaY * 0.0015;
  const newZoom = Math.max(0.3, Math.min(2, state.zoom * (1 + delta)));
  const rect = host.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  state.pan.x = cx - (cx - state.pan.x) * (newZoom / state.zoom);
  state.pan.y = cy - (cy - state.pan.y) * (newZoom / state.zoom);
  state.zoom = newZoom;
  applyTransform();
}, { passive: false });

let touchStart = null;
host.addEventListener('touchstart', (e) => {
  if (e.target.closest('.card') || e.target.closest('button')) return;
  if (e.touches.length === 1) {
    touchStart = { x: e.touches[0].clientX - state.pan.x, y: e.touches[0].clientY - state.pan.y };
  }
});
host.addEventListener('touchmove', (e) => {
  if (!touchStart || e.touches.length !== 1) return;
  state.pan.x = e.touches[0].clientX - touchStart.x;
  state.pan.y = e.touches[0].clientY - touchStart.y;
  applyTransform();
});
host.addEventListener('touchend', () => { touchStart = null; });

document.getElementById('zoom-in').onclick    = () => { state.zoom = Math.min(2, state.zoom * 1.15); applyTransform(); };
document.getElementById('zoom-out').onclick   = () => { state.zoom = Math.max(0.3, state.zoom / 1.15); applyTransform(); };
document.getElementById('zoom-reset').onclick = () => { state.zoom = 1; applyTransform(); centerOn(state.focused); };

function centerOn(id) {
  if (!id || !state.visible.has(id)) return;
  const card = cardsEl.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  if (!card) return;
  const rect = host.getBoundingClientRect();
  const cardLeft = parseFloat(card.style.left);
  const cardTop  = parseFloat(card.style.top);
  state.pan.x = rect.width/2  - (cardLeft + CARD_W/2) * state.zoom;
  state.pan.y = rect.height/2 - (cardTop + CARD_H/2) * state.zoom;
  applyTransform();
}

document.getElementById('btn-fit').onclick = () => centerOn(state.focused);
document.getElementById('btn-reset').onclick = () => focusOn('Edgar Yael Miranda Islas');
document.getElementById('btn-expand-all').onclick = () => expandAll();
document.getElementById('btn-collapse-all').onclick = () => collapseAll();

// ---------- Búsqueda ----------
const searchInput = document.getElementById('search');
const sugBox = document.getElementById('suggestions');
const allNames = Object.keys(PEOPLE).filter(n => !PEOPLE[n]._placeholder).sort((a,b)=>a.localeCompare(b,'es'));
let activeIdx = -1;

function renderSuggestions(q) {
  const ql = q.toLowerCase().trim();
  if (!ql) { sugBox.classList.remove('open'); sugBox.innerHTML=''; return; }
  const matches = allNames.filter(n => n.toLowerCase().includes(ql)).slice(0, 12);
  if (!matches.length) { sugBox.classList.remove('open'); sugBox.innerHTML=''; return; }
  sugBox.innerHTML = matches.map((n,i) =>
    `<div data-name="${escapeHtml(n)}" class="${i===activeIdx?'active':''}">${escapeHtml(n)}<span class="gen-tag">Gen ${PEOPLE[n].g}</span></div>`
  ).join('');
  sugBox.classList.add('open');
  sugBox.querySelectorAll('div').forEach(d => {
    d.addEventListener('mousedown', (e) => { e.preventDefault(); focusOn(d.dataset.name); searchInput.value=''; sugBox.classList.remove('open'); });
  });
}
searchInput.addEventListener('input', (e) => { activeIdx=-1; renderSuggestions(e.target.value); });
searchInput.addEventListener('keydown', (e) => {
  const items = sugBox.querySelectorAll('div');
  if (e.key === 'ArrowDown') { activeIdx = Math.min(items.length-1, activeIdx+1); renderSuggestions(searchInput.value); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { activeIdx = Math.max(0, activeIdx-1); renderSuggestions(searchInput.value); e.preventDefault(); }
  else if (e.key === 'Enter') {
    const sel = items[activeIdx] || items[0];
    if (sel) { focusOn(sel.dataset.name); searchInput.value=''; sugBox.classList.remove('open'); }
  } else if (e.key === 'Escape') { sugBox.classList.remove('open'); searchInput.blur(); }
});
document.addEventListener('mousedown', (e) => { if (!e.target.closest('.search-wrap')) sugBox.classList.remove('open'); });

// ---------- Side Panel ----------
const panel = document.getElementById('panel');
const panelName = document.getElementById('panel-name');
const panelTags = document.getElementById('panel-tags');
const panelDates = document.getElementById('panel-dates');
const panelPareja = document.getElementById('panel-pareja');
const panelPadres = document.getElementById('panel-padres');
const panelHijos = document.getElementById('panel-hijos');
const panelHermanos = document.getElementById('panel-hermanos');
document.getElementById('panel-close').onclick = closePanel;

function closePanel() {
  document.body.classList.remove('panel-open');
  state.selected = null;
  render();
  if (state.focused) setTimeout(() => centerOn(state.focused), 250);
}

function chipsFor(list, container) {
  container.innerHTML = '';
  if (!list || !list.length) {
    const empty = document.createElement('span');
    empty.className = 'value muted';
    empty.textContent = 'Ninguno registrado';
    container.appendChild(empty);
    return;
  }
  list.forEach(name => {
    const p = PEOPLE[name];
    const chip = document.createElement('button');
    chip.className = 'chip' + (p && p._placeholder ? ' placeholder' : '');
    const sex = p ? (p.s || 'M') : 'M';
    chip.innerHTML = `<span class="sex-dot ${sex}"></span><span class="name-text">${escapeHtml(name)}</span>`;
    chip.title = name + (p ? ` · Gen ${p.g}` : '');
    chip.onclick = () => focusOn(name);
    container.appendChild(chip);
  });
}

function openPanel(id) {
  const info = PEOPLE[id]; if (!info) return;
  state.selected = id;
  panelName.textContent = id;

  // tags
  panelTags.innerHTML = '';
  const tagGen = document.createElement('span');
  tagGen.className = 'tag'; tagGen.textContent = `Generación ${info.g}`;
  panelTags.appendChild(tagGen);
  const tagSex = document.createElement('span');
  tagSex.className = 'tag gender-' + (info.s || 'M');
  tagSex.textContent = (info.s === 'F') ? 'Femenino' : 'Masculino';
  panelTags.appendChild(tagSex);

  // Fechas
  if (info.b || info.d) {
    panelDates.classList.remove('muted');
    panelDates.textContent = `${info.b || '?'} – ${info.d || ''}`;
  } else {
    panelDates.classList.add('muted');
    panelDates.textContent = 'No disponibles';
  }

  chipsFor(info.p, panelPareja);
  chipsFor(info.pa, panelPadres);
  chipsFor(info.c, panelHijos);
  chipsFor(info.h, panelHermanos);

  document.body.classList.add('panel-open');
}

// ---------- Init ----------
focusOn('Edgar Yael Miranda Islas');
</script>
