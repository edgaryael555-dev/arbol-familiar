<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Árbol Familiar</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <h1>Árbol Familiar</h1>

    <div class="toolbar">
      <input id="searchPerson" type="search" placeholder="Buscar persona..." aria-label="Buscar persona" />
      <button id="expandAll">Expandir todo</button>
      <button id="collapseAll">Minimizar todo</button>
      <button id="resetView">Centrar vista</button>
    </div>
  </header>

  <div id="tree-container">
    <svg></svg>
  </div>

  <script>
    const width = window.innerWidth;
    const height = window.innerHeight - 64;

    const svg = d3.select("svg")
      .attr("width", width)
      .attr("height", height);

    const g = svg.append("g");

    const zoom = d3.zoom()
      .scaleExtent([0.2, 3])
      .on("zoom", event => {
        g.attr("transform", event.transform);
      });

    svg.call(zoom);

    const cardWidth = 155;
    const cardHeight = 106;
    const coupleGap = 18;
    const levelGap = 190;
    // Nota para merges: usamos layout lateral simple (una fila) para evitar empalmes.
    const siblingGap = 150;
    const siblingColumnGap = 340;

    const treeLayout = d3.tree().nodeSize([360, levelGap]);

    function normalizeTreeData(node) {
      const normalized = { ...node };
      const descendants = Array.isArray(node.descendants) ? node.descendants : [];
      const children = Array.isArray(node.children) ? node.children : [];
      normalized.children = [...children, ...descendants].map(normalizeTreeData);
      if (Array.isArray(node.siblings)) {
        normalized.siblings = node.siblings.map(sibling => normalizeTreeData({ ...sibling, children: sibling.children || sibling.descendants || [] }));
      }
      return normalized;
    }

    function hasSpouse(d) {
      return d.data.spouse && typeof d.data.spouse === "object";
    }

    function groupWidth(d) {
      return hasSpouse(d)
        ? cardWidth * 2 + coupleGap
        : cardWidth;
    }

    function personClass(person) {
      if (person.gender === "Hombre") return "person-box male";
      if (person.gender === "Mujer") return "person-box female";
      return "person-box";
    }

    function hasAncestors(d) {
      return d.children || d._children;
    }

    function hasDescendants(d) {
      return Boolean(d.parent);
    }

    function hasSiblings(d) {
      return Array.isArray(d.data.siblings) && d.data.siblings.length > 0;
    }

    function hasSpouseSiblings(d) {
      return Array.isArray(d.data.spouse?.siblings) && d.data.spouse.siblings.length > 0;
    }

    function wrapText(textSelection, maxWidth) {
      textSelection.each(function() {
        const text = d3.select(this);
        const words = text.text().split(/\s+/).reverse();
        let word;
        let line = [];
        let lineNumber = 0;
        const lineHeight = 14;
        const y = text.attr("y");
        const x = text.attr("x") || 0;

        text.text(null);

        let tspan = text.append("tspan")
          .attr("x", x)
          .attr("y", y);

        while ((word = words.pop())) {
          line.push(word);
          tspan.text(line.join(" "));

          if (tspan.node().getComputedTextLength() > maxWidth && line.length > 1) {
            line.pop();
            tspan.text(line.join(" "));
            line = [word];

            tspan = text.append("tspan")
              .attr("x", x)
              .attr("y", y)
              .attr("dy", `${++lineNumber * lineHeight}px`)
              .text(word);
          }
        }
      });
    }

    function drawPersonCard(group, person, xOffset, yOffset = 0, extraClass = "", relationLabel = "") {
      const card = group.append("g")
        .attr("class", extraClass)
        .attr("transform", `translate(${xOffset},${yOffset})`);

      if (relationLabel) {
        card.append("text")
          .attr("class", "relation-label")
          .attr("text-anchor", "middle")
          .attr("x", 0)
          .attr("y", -cardHeight / 2 - 10)
          .text(relationLabel);
      }

      card.append("rect")
        .attr("class", personClass(person))
        .attr("x", -cardWidth / 2)
        .attr("y", -cardHeight / 2)
        .attr("width", cardWidth)
        .attr("height", cardHeight);

      card.append("text")
        .attr("class", "person-name")
        .attr("text-anchor", "middle")
        .attr("x", 0)
        .attr("y", -22)
        .text(person.name || "")
        .call(wrapText, 125);

      card.append("text")
        .attr("class", "person-info")
        .attr("text-anchor", "middle")
        .attr("x", 0)
        .attr("y", 30)
        .text(person.years || "");

      return card;
    }

    function drawCoupleOrSingle(group, personData, xOffset = 0, yOffset = 0, extraClass = "") {
      const wrapper = group.append("g")
        .attr("class", extraClass)
        .attr("transform", `translate(${xOffset},${yOffset})`);

      if (personData.spouse && typeof personData.spouse === "object") {
        const leftX = -(cardWidth / 2 + coupleGap / 2);
        const rightX = cardWidth / 2 + coupleGap / 2;

        drawPersonCard(wrapper, personData, leftX, 0, "", "Hijo/a");
        drawPersonCard(wrapper, personData.spouse, rightX, 0, "", "Pareja");

        wrapper.append("text")
          .attr("class", "heart")
          .attr("text-anchor", "middle")
          .attr("x", 0)
          .attr("y", 6)
          .text("♥");
      } else {
        drawPersonCard(wrapper, personData, 0, 0, "", "Hijo/a");
      }

      return wrapper;
    }


    function getSiblingDirection(d) {
      if (d.data.gender === "Hombre") return -1;
      if (d.data.gender === "Mujer") return 1;
      return 1;
    }

    function getSiblingArrowX(d, side) {
      const groupHalfWidth = hasSpouse(d)
        ? (cardWidth * 2 + coupleGap) / 2
        : cardWidth / 2;
      return side * (groupHalfWidth + 18);
    }

    function drawSiblingGroup(group, d) {
      if (!d.siblingsExpanded || (!hasSiblings(d) && !hasSpouseSiblings(d))) return;

      const direction = getSiblingDirection(d);
      const primaryCenterX = hasSpouse(d) ? -(cardWidth / 2 + coupleGap / 2) : 0;
      const anchorX = primaryCenterX + direction * (cardWidth / 2);
      const startX = anchorX + direction * siblingGap;

      d.data.siblings.forEach((sibling, index) => {
        const yOffset = 0;
        const xOffset = startX + direction * index * siblingColumnGap;
        const targetEdgeX = xOffset - direction * (cardWidth / 2);

        group.append("path")
          .attr("class", "sibling-link")
          .attr("d", `
            M ${anchorX},0
            C ${anchorX + direction * 58},0
              ${targetEdgeX - direction * 95},${yOffset}
              ${targetEdgeX},${yOffset}
          `);

        drawCoupleOrSingle(group, sibling, xOffset, yOffset, "sibling-card");
      });

      if (hasSpouseSiblings(d)) {
        const spouseCenterX = cardWidth / 2 + coupleGap / 2;
        const spouseDirection = -direction;
        const spouseAnchorX = spouseCenterX + spouseDirection * (cardWidth / 2);
        const spouseStartX = spouseAnchorX + spouseDirection * siblingGap;

        d.data.spouse.siblings.forEach((sibling, index) => {
          const yOffset = 0;
          const xOffset = spouseStartX + spouseDirection * index * siblingColumnGap;
          const targetEdgeX = xOffset - spouseDirection * (cardWidth / 2);

          group.append("path")
            .attr("class", "sibling-link spouse-sibling-link")
            .attr("d", `
              M ${spouseAnchorX},0
              C ${spouseAnchorX + spouseDirection * 58},0
                ${targetEdgeX - spouseDirection * 95},${yOffset}
                ${targetEdgeX},${yOffset}
            `);

          drawCoupleOrSingle(group, sibling, xOffset, yOffset, "sibling-card spouse-sibling-card");
        });
      }
    }

    fetch("family.json")
      .then(response => response.json())
      .then(rawData => {
        const root = d3.hierarchy(normalizeTreeData(rawData));

        root.x0 = width / 2;
        root.y0 = height - 130;

        if (root.children) root.children.forEach(collapse);

        update(root);
        centerView();

        function centerView() {
          svg.call(zoom.transform, d3.zoomIdentity.translate(width / 2, 30).scale(0.75));
        }

        document.getElementById("resetView").addEventListener("click", centerView);

        document.getElementById("expandAll").addEventListener("click", () => {
          expandAll(root);
          update(root);
        });

        document.getElementById("collapseAll").addEventListener("click", () => {
          collapseAll(root);
          closeAllSiblings(root);
          update(root);
        });

        document.getElementById("searchPerson").addEventListener("input", (event) => {
          const query = event.target.value.trim().toLowerCase();
          d3.selectAll(".person-card").classed("highlight", d => query && (d.data.name || "").toLowerCase().includes(query));
        });

        function collapse(d) {
          if (d.children) {
            d._children = d.children;
            d._children.forEach(collapse);
            d.children = null;
          }
        }

        function expandAll(d) {
          if (d._children) {
            d.children = d._children;
            d._children = null;
          }

          if (d.children) d.children.forEach(expandAll);
        }

        function collapseAll(d) {
          if (d.children) {
            d.children.forEach(collapseAll);
            d._children = d.children;
            d.children = null;
          }
        }

        function closeAllSiblings(d) {
          d.siblingsExpanded = false;
          if (d.children) d.children.forEach(closeAllSiblings);
          if (d._children) d._children.forEach(closeAllSiblings);
        }

        function toggleAncestors(d) {
          if (d.children) {
            d._children = d.children;
            d.children = null;
          } else if (d._children) {
            d.children = d._children;
            d._children = null;
          }
        }

        function update(source) {
          treeLayout(root);

          const nodes = root.descendants();
          const links = root.links();

          nodes.forEach(d => {
            d.y = height - 130 - d.depth * levelGap;
          });

          const link = g.selectAll(".link")
            .data(links, d => d.target.data.name);

          link.enter().append("path").attr("class", "link").merge(link)
            .transition().duration(300)
            .attr("d", d => {
              const sourceX = d.source.x;
              const sourceY = d.source.y - cardHeight / 2 - 22;
              const targetX = d.target.x;
              const targetY = d.target.y + cardHeight / 2 + 8;
              const midY = (sourceY + targetY) / 2;
              return `M ${sourceX},${sourceY} C ${sourceX},${midY} ${targetX},${midY} ${targetX},${targetY}`;
            });

          link.exit().remove();

          const node = g.selectAll(".person-card").data(nodes, d => d.data.name);
          node.exit().remove();

          const nodeEnter = node.enter().append("g")
            .attr("class", "person-card")
            .attr("transform", d => `translate(${source.x0 || 0},${source.y0 || 0})`);

          nodeEnter.each(function(d) { drawCoupleOrSingle(d3.select(this), d.data); });

          nodeEnter.append("path").attr("class", "toggle-arrow ancestor-toggle")
            .attr("d", d => d._children ? "M -4,-56 L 0,-52 L 4,-56" : "M -4,-52 L 0,-56 L 4,-52")
            .style("display", d => hasAncestors(d) ? "block" : "none")
            .on("click", (event, d) => { event.stopPropagation(); toggleAncestors(d); update(d); });

          nodeEnter.append("path").attr("class", "toggle-arrow descendant-toggle")
            .attr("d", d => d._children ? "M -4,66 L 0,70 L 4,66" : "M -4,70 L 0,66 L 4,70")
            .style("display", d => hasDescendants(d) ? "block" : "none")
            .on("click", (event, d) => { event.stopPropagation(); toggleAncestors(d); update(d); });

          nodeEnter.append("path").attr("class", "toggle-arrow sibling-toggle sibling-toggle-right")
            .attr("d", d => {
              const bx = getSiblingArrowX(d, 1);
              return d.siblingsExpanded
                ? `M ${bx + 4},-4 L ${bx},0 L ${bx + 4},4`
                : `M ${bx},-4 L ${bx + 4},0 L ${bx},4`;
            })
            .style("display", d => (hasSiblings(d) || hasSpouseSiblings(d)) ? "block" : "none")
            .on("click", (event, d) => { event.stopPropagation(); d.siblingsExpanded = !d.siblingsExpanded; update(d); });

          nodeEnter.append("path").attr("class", "toggle-arrow sibling-toggle sibling-toggle-left")
            .attr("d", d => {
              const bx = getSiblingArrowX(d, -1);
              return d.siblingsExpanded
                ? `M ${bx - 4},-4 L ${bx},0 L ${bx - 4},4`
                : `M ${bx},-4 L ${bx - 4},0 L ${bx},4`;
            })
            .style("display", d => (hasSiblings(d) || hasSpouseSiblings(d)) ? "block" : "none")
            .on("click", (event, d) => { event.stopPropagation(); d.siblingsExpanded = !d.siblingsExpanded; update(d); });

          const nodeUpdate = nodeEnter.merge(node);
          nodeUpdate.transition().duration(300).attr("transform", d => `translate(${d.x},${d.y})`);

          nodeUpdate.select(".ancestor-toggle").style("display", d => hasAncestors(d) ? "block" : "none")
            .attr("d", d => d._children ? "M -4,-56 L 0,-52 L 4,-56" : "M -4,-52 L 0,-56 L 4,-52");

          nodeUpdate.select(".descendant-toggle").style("display", d => hasDescendants(d) ? "block" : "none")
            .attr("d", d => d._children ? "M -4,66 L 0,70 L 4,66" : "M -4,70 L 0,66 L 4,70");

          nodeUpdate.select(".sibling-toggle-right").style("display", d => (hasSiblings(d) || hasSpouseSiblings(d)) ? "block" : "none")
            .attr("d", d => {
              const bx = getSiblingArrowX(d, 1);
              return d.siblingsExpanded
                ? `M ${bx + 4},-4 L ${bx},0 L ${bx + 4},4`
                : `M ${bx},-4 L ${bx + 4},0 L ${bx},4`;
            });

          nodeUpdate.select(".sibling-toggle-left").style("display", d => (hasSiblings(d) || hasSpouseSiblings(d)) ? "block" : "none")
            .attr("d", d => {
              const bx = getSiblingArrowX(d, -1);
              return d.siblingsExpanded
                ? `M ${bx - 4},-4 L ${bx},0 L ${bx - 4},4`
                : `M ${bx},-4 L ${bx - 4},0 L ${bx},4`;
            });

          nodeUpdate.each(function(d) {
            const group = d3.select(this);
            group.selectAll(".sibling-render").remove();
            if (d.siblingsExpanded && hasSiblings(d)) {
              drawSiblingGroup(group.append("g").attr("class", "sibling-render"), d);
            }
          });

          nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
        }
      });
  </script>
</body>
</html>
